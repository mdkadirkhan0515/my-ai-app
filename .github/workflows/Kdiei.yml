import React, { useState } from 'react';
import { View, Text, TouchableOpacity, StyleSheet, SafeAreaView } from 'react-native';

const buttons = [
  ['C', '⌫', '%', '÷'],
  ['7', '8', '9', '×'],
  ['4', '5', '6', '−'],
  ['1', '2', '3', '+'],
  ['00', '0', '.', '='],
];

export default function Calculator() {
  const [display, setDisplay] = useState('0');
  const [expression, setExpression] = useState('');
  const [previousValue, setPreviousValue] = useState(null);
  const [operator, setOperator] = useState(null);
  const [waitingForOperand, setWaitingForOperand] = useState(false);

  // সংখ্যা বাটন চাপলে (0-9, 00)
  const inputDigit = (digit) => {
    if (waitingForOperand) {
    if (digit === '00') {
  setDisplay('0');
} else {
  setDisplay(digit);
}
      setWaitingForOperand(false);
      return;
    }
    setDisplay(display === '0' ? (digit === '00' ? '0' : digit) : display + digit);
  };

  // দশমিক বিন্দু
  const inputDecimal = () => {
    if (waitingForOperand) {
      setDisplay('0.');
      setWaitingForOperand(false);
      return;
    }
    if (!display.includes('.')) setDisplay(display + '.');
  };

  // C - সব রিসেট
  const clearAll = () => {
    setDisplay('0');
    setExpression('');
    setPreviousValue(null);
    setOperator(null);
    setWaitingForOperand(false);
  };

  // ⌫ - শেষ ডিজিট মুছে ফেলা
  const backspace = () => {
    if (waitingForOperand) return;
    setDisplay(display.length === 1 ? '0' : display.slice(0, -1));
  };

  // %
  const inputPercent = () => {
    setDisplay(String(parseFloat(display) / 100));
  };

  // দুইটা সংখ্যার হিসাব
  const calculate = (a, b, op) => {
    switch (op) {
      case '+': return a + b;
      case '−': return a - b;
      case '×': return a * b;
      case '÷': return b === 0 ? 0 : a / b;
      default: return b;
    }
  };

  // +, −, ×, ÷ চাপলে
  const handleOperator = (nextOperator) => {
    const inputValue = parseFloat(display);

    if (previousValue !== null && operator && !waitingForOperand) {
      const result = calculate(previousValue, inputValue, operator);
      setDisplay(String(result));
      setPreviousValue(result);
      setExpression(`${result} ${nextOperator}`);
    } else {
      setPreviousValue(inputValue);
      setExpression(`${inputValue} ${nextOperator}`);
    }

    setOperator(nextOperator);
    setWaitingForOperand(true);
  };

  // = চাপলে
  const handleEquals = () => {
    if (operator === null || previousValue === null) return;
    const inputValue = parseFloat(display);
    const result = calculate(previousValue, inputValue, operator);
    setExpression(`${previousValue} ${operator} ${inputValue} =`);
    setDisplay(String(result));
    setPreviousValue(null);
    setOperator(null);
    setWaitingForOperand(true);
  };

  const onPress = (btn) => {
    if (btn === 'C') return clearAll();
    if (btn === '⌫') return backspace();
    if (btn === '%') return inputPercent();
    if (btn === '.') return inputDecimal();
    if (btn === '=') return handleEquals();
    if (['÷', '×', '−', '+'].includes(btn)) return handleOperator(btn);
    return inputDigit(btn);
  };

  return (
    <SafeAreaView style={styles.container}>
      <View style={styles.display}>
        <Text style={styles.displaySubText}>{expression}</Text>
        <Text style={styles.displayMainText} numberOfLines={1} adjustsFontSizeToFit>
          {display}
        </Text>
      </View>

      <View style={styles.grid}>
        {buttons.map((row, i) => (
          <View key={i} style={styles.row}>
            {row.map((btn) => {
              const isOperator = ['÷', '×', '−', '+', '='].includes(btn);
              const isFunction = ['C', '⌫', '%'].includes(btn);
              return (
                <TouchableOpacity
                  key={btn}
                  onPress={() => onPress(btn)}
                  activeOpacity={0.7}
                  style={[
                    styles.button,
                    isOperator && styles.operatorButton,
                    isFunction && styles.functionButton,
                  ]}
                >
                  <Text
                    style={[
                      styles.buttonText,
                      isOperator && styles.operatorText,
                      isFunction && styles.functionText,
                    ]}
                  >
                    {btn}
                  </Text>
                </TouchableOpacity>
              );
            })}
          </View>
        ))}
      </View>
    </SafeAreaView>
  );
}

const styles = StyleSheet.create({
  container: {
    flex: 1,
    backgroundColor: '#0B0F19',
    justifyContent: 'flex-end',
    padding: 16,
  },
  display: {
    marginBottom: 32,
    alignItems: 'flex-end',
  },
  displaySubText: {
    color: '#94A3B8',
    fontSize: 18,
    marginBottom: 8,
  },
  displayMainText: {
    color: '#F8FAFC',
    fontSize: 56,
    fontWeight: '300',
  },
  grid: { gap: 12 },
  row: {
    flexDirection: 'row',
    gap: 12,
    marginBottom: 12,
  },
  button: {
    flex: 1,
    aspectRatio: 1,
    backgroundColor: 'rgba(30, 41, 59, 0.8)',
    borderWidth: 1,
    borderColor: 'rgba(56, 189, 248, 0.3)',
    borderRadius: 20,
    justifyContent: 'center',
    alignItems: 'center',
  },
  operatorButton: {
    backgroundColor: '#38BDF8',
    borderColor: '#38BDF8',
  },
  functionButton: {
    backgroundColor: 'rgba(148, 163, 184, 0.15)',
  },
  buttonText: {
    color: '#F8FAFC',
    fontSize: 24,
    fontWeight: '500',
  },
  operatorText: {
    color: '#0B0F19',
    fontWeight: '700',
  },
  functionText: {
    color: '#94A3B8',
    fontWeight: '600',
  },
});
