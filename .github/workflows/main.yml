import React, { useState, useEffect } from "react";
import {
  View,
  Text,
  Button,
  TouchableOpacity,
  FlatList,
  StyleSheet,
  ActivityIndicator,
} from "react-native";

// কোনো বাইরের প্যাকেজ লাগছে না — শুধু react-native-এর built-in component
const DIVISIONS_URL =
  "https://raw.githubusercontent.com/mdkadirkhan0515/Highschool-/main/divisions/102/districts.json";

export default function App() {
  const [lang, setLang] = useState("bn");
  const [divisions, setDivisions] = useState([]);
  const [selectedId, setSelectedId] = useState(null);
  const [loading, setLoading] = useState(true);
  const [error, setError] = useState(null);

  useEffect(() => {
    fetch(DIVISIONS_URL)
      .then((res) => res.json())
      .then((data) => {
        setDivisions(data);
        setSelectedId(data[0]?.id ?? null);
        setLoading(false);
      })
      .catch(() => {
        setError("GitHub থেকে তালিকা আনা যায়নি");
        setLoading(false);
      });
  }, []);

  if (loading) {
    return (
      <View style={styles.center}>
        <ActivityIndicator size="large" />
        <Text>লোড হচ্ছে...</Text>
      </View>
    );
  }

  if (error) {
    return (
      <View style={styles.center}>
        <Text>{error}</Text>
      </View>
    );
  }

  return (
    <View style={styles.container}>
      <Button
        title={lang === "bn" ? "Switch to English" : "বাংলায় দেখান"}
        onPress={() => setLang(lang === "bn" ? "en" : "bn")}
      />

      <FlatList
        style={styles.list}
        data={divisions}
        keyExtractor={(item) => String(item.id)}
        renderItem={({ item }) => {
          const isSelected = item.id === selectedId;
          return (
            <TouchableOpacity
              style={[styles.row, isSelected && styles.rowSelected]}
              onPress={() => setSelectedId(item.id)}
            >
              <Text style={[styles.rowText, isSelected && styles.rowTextSelected]}>
                {lang === "bn" ? item.bn : item.en}
              </Text>
            </TouchableOpacity>
          );
        }}
      />

      <Text style={styles.result}>সিলেক্ট করা ID (ব্যাকগ্রাউন্ডে): {selectedId}</Text>
    </View>
  );
}

const styles = StyleSheet.create({
  container: { flex: 1, padding: 20, paddingTop: 60 },
  center: { flex: 1, justifyContent: "center", alignItems: "center" },
  list: { marginTop: 16 },
  row: {
    padding: 14,
    borderBottomWidth: 1,
    borderBottomColor: "#eee",
  },
  rowSelected: { backgroundColor: "#6c4fd6" },
  rowText: { fontSize: 15, color: "#222" },
  rowTextSelected: { color: "#fff", fontWeight: "600" },
  result: { marginTop: 16, fontSize: 14, color: "#555" },
});
